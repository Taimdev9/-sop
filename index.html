<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, orientation=landscape">
    <title>LAST BEAT 3D</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="gameViewport" class="device-computer">
        <div id="threeCanvasContainer"></div>

        <div id="fxLayer" class="fx-layer-container">
            <div id="vignetteNormal" class="vignette-layer"></div>
            <div id="vignetteCritical" class="vignette-critical hidden"></div>
            <div id="crtOverlay" class="crt-overlay-layer"></div>
            <div id="screenFlash" class="flash-layer"></div>
            <div id="blurOverlay" class="blur-layer hidden"></div>
        </div>

        <div id="crosshair" class="crosshair-dot hidden"></div>

        <div id="audioInitModal" class="overlay-modal active">
            <div class="modal-card">
                <div class="icon-pulse">🎧</div>
                <h2 class="card-title">تجربة صوتية ورعب نفسي 3D</h2>
                <p class="card-desc">استخدم السماعات للحصول على مجسم صووتي كامل ونبض حقيقي.</p>
                <button id="btnInitAudio" class="main-action-btn">بدء التجربة</button>
            </div>
        </div>

        <div id="loadingScreen" class="overlay-modal hidden">
            <div class="brand-box">
                <div class="team-tag">TRL TEAM FOR DEVELOPMENT</div>
                <h1 class="main-title-3d">LAST BEAT</h1>
                <div class="sub-title-ar">آخر نبضة</div>
                
                <div class="ecg-container">
                    <svg class="ecg-svg" viewBox="0 0 600 120">
                        <path class="ecg-bg" d="M0,60 L200,60 L210,30 L220,90 L230,10 L240,110 L250,60 L600,60"/>
                        <path id="ecgPath" class="ecg-pulse" d="M0,60 L200,60 L210,30 L220,90 L230,10 L240,110 L250,60 L600,60"/>
                    </svg>
                </div>
                
                <div id="loadStatusText" class="status-msg">جاري تجهيز مستشفى 2089...</div>
            </div>
        </div>

        <div id="deviceModal" class="overlay-modal hidden">
            <div class="device-card-modal">
                <h2 class="device-heading">Choose Your Device</h2>
                <div class="device-options-grid">
                    <div class="device-option-box" data-device="phone">
                        <div class="dev-icon">📱</div>
                        <div class="dev-name">Phone</div>
                    </div>
                    <div class="device-option-box" data-device="tablet">
                        <div class="dev-icon">📱</div>
                        <div class="dev-name">Tablet</div>
                    </div>
                    <div class="device-option-box" data-device="ipad">
                        <div class="dev-icon">🖥️</div>
                        <div class="dev-name">iPad</div>
                    </div>
                    <div class="device-option-box active-dev" data-device="computer">
                        <div class="dev-icon">💻</div>
                        <div class="dev-name">Computer</div>
                    </div>
                </div>
                <button id="btnStartGame" class="main-action-btn">دخول المستشفى ◄</button>
            </div>
        </div>

        <div id="hudOverlay" class="hud-layer hidden">
            <div class="hud-left">
                <div class="heart-panel">
                    <div id="heartIcon" class="heart-icon">❤️</div>
                    <div class="heart-info">
                        <div class="stability-row">
                            <span class="st-label">STABILITY</span>
                            <span id="txtStability" class="st-val">100%</span>
                        </div>
                        <div class="st-bar-bg">
                            <div id="stBarFill" class="st-bar-fill" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>
                <div class="bpm-panel">
                    <div class="bpm-title">BPM</div>
                    <div id="txtBpm" class="bpm-num">72</div>
                </div>
            </div>

            <div class="hud-right">
                <canvas id="hudEcgCanvas" width="150" height="40"></canvas>
            </div>
        </div>

        <div id="dialogueBox" class="dialogue-box hidden">
            <div id="dialogueSpeaker" class="speaker-title">DOCTOR</div>
            <div id="dialogueText" class="speaker-body">...</div>
            <div class="dialogue-hint">اضغط للمتابعة ◄</div>
        </div>

        <div id="touchControls" class="touch-layer hidden">
            <div id="touchMoveZone" class="touch-zone left-zone">
                <div id="joystickKnob" class="joystick-knob"></div>
            </div>
            <div id="touchLookZone" class="touch-zone right-zone"></div>
            <div class="touch-actions">
                <button id="btnTouchRun" class="touch-action-btn">🏃</button>
                <button id="btnTouchInteract" class="touch-action-btn">✋</button>
            </div>
        </div>

        <div id="endingOverlay" class="overlay-modal hidden">
            <div class="ending-card">
                <h1 id="endingTitle" class="ending-title">...</h1>
                <div class="ending-ecg-box">
                    <canvas id="endingEcgCanvas" width="350" height="80"></canvas>
                </div>
                <p id="endingStory" class="ending-desc">...</p>
                <button id="btnRestart" class="main-action-btn">إعادة التجربة</button>
            </div>
        </div>

    </div>

    <script src="game.js"></script>
</body>
</html>
